# .github/workflows/build.yml

name: Build Python Wheels

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    # Target the RTX 4060’s compute capability so torch’s C++ extension logic
    # never hits an empty arch_list.
    env:
      TORCH_CUDA_ARCH_LIST: "8.9"

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Install build tools & NumPy
        run: python -m pip install --upgrade pip setuptools wheel numpy

      - name: Install official PyTorch nightly 2.8.0.dev20250501+cu128
        run: python -m pip install torch==2.8.0.dev20250501+cu128 --extra-index-url https://download.pytorch.org/whl/cu128

      - name: Install CUDA Toolkit 12.8
        id: cuda-toolkit
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: "12.8.0"
          use-github-cache: false
          use-local-cache: false

      - name: Export CUDA_HOME
        shell: pwsh
        run: echo "CUDA_HOME=${{ steps.cuda-toolkit.outputs.CUDA_PATH }}" >> $Env:GITHUB_ENV

      - name: Build wheel (no isolation)
        run: python -m pip wheel . --no-deps --no-build-isolation -w dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: torch-cublas-hgemm-wheel
          path: dist/*.whl

